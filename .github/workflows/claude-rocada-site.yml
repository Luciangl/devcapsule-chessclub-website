name: Rocada site (test4)
on:
  push:
    paths: ['claude-rocada-site/**', 'scripts/gcs/**', '.github/workflows/claude-rocada-site.yml']
  pull_request:
    paths: ['claude-rocada-site/**', 'scripts/gcs/**', '.github/workflows/claude-rocada-site.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the selected revision to smartgalati-test4
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: rocada-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude-rocada-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: claude-rocada-site/package-lock.json
      - run: npm ci
      - run: npm test && npm run test:contrast && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser, palette and accessibility checks
        run: |
          npm run preview > /tmp/rocada-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4326/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
          npm run test:themes
      - uses: actions/upload-artifact@v4
        with:
          name: rocada-static-site
          path: claude-rocada-site/dist
  deploy:
    # Optional: needs the repository variables GCP_WORKLOAD_IDENTITY_PROVIDER and
    # GCP_DEPLOY_SERVICE_ACCOUNT. Local authenticated deployment does not need this job.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: rocada-test4-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: claude-rocada-site/package-lock.json
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: npm ci --prefix claude-rocada-site
      - run: npm run deploy --prefix claude-rocada-site -- update
