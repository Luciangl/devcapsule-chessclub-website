<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldPiece" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad)" />
  
  <!-- Subtle chessboard pattern in background -->
  <g opacity="0.06">
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="#ffffff" />
      <rect x="50" y="50" width="50" height="50" fill="#ffffff" />
    </pattern>
    <rect width="800" height="500" fill="url(#grid)" />
  </g>
  
  <!-- Stylized Chess King & Queen & Knight -->
  <!-- King -->
  <g transform="translate(360, 140)">
    <!-- Cross -->
    <rect x="36" y="10" width="8" height="24" rx="2" fill="url(#goldPiece)" />
    <rect x="28" y="18" width="24" height="8" rx="2" fill="url(#goldPiece)" />
    <!-- Crown -->
    <path d="M20 40 Q40 32 60 40 L55 90 Q40 96 25 90 Z" fill="url(#goldPiece)" />
    <!-- Body -->
    <path d="M25 90 Q15 150 18 200 L62 200 Q65 150 55 90 Z" fill="url(#goldPiece)" />
    <!-- Base -->
    <rect x="10" y="200" width="60" height="18" rx="4" fill="url(#goldPiece)" />
  </g>

  <!-- Knight Left -->
  <g transform="translate(230, 180) scale(0.85)">
    <path d="M60 40 C55 38 48 42 45 48 C40 45 32 48 30 54 C26 60 25 70 30 78 C32 82 35 85 32 90 C28 95 24 105 24 115 L80 115 C80 105 78 95 80 85 C82 72 82 55 75 45 C70 41 65 40 60 40 Z" fill="#94a3b8" opacity="0.8" />
    <rect x="18" y="115" width="70" height="16" rx="4" fill="#94a3b8" opacity="0.8" />
  </g>

  <!-- Rook Right -->
  <g transform="translate(500, 190) scale(0.8)">
    <path d="M25 40 L35 40 L35 50 L45 50 L45 40 L55 40 L55 50 L65 50 L65 40 L75 40 L70 80 L30 80 Z" fill="#cbd5e1" opacity="0.7"/>
    <path d="M30 80 Q20 120 25 150 L75 150 Q80 120 70 80 Z" fill="#cbd5e1" opacity="0.7"/>
    <rect x="15" y="150" width="70" height="16" rx="4" fill="#cbd5e1" opacity="0.7"/>
  </g>
  
  <text x="400" y="420" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="3">ACS SMART GALAȚI</text>
  <text x="400" y="450" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#f59e0b" text-anchor="middle" letter-spacing="4">CLUBUL DE ȘAH PENTRU ÎNCEPĂTORI ȘI AVANSAȚI</text>
</svg>
